      model: deepseek-v4-flash
      maxTokens: 3000
      maxIterations: 5
tests: file://./evals/feishu/multitask-cases.yaml
defaultTest:
  assert:
    - type: javascript
      value: file://./evals/feishu/assert-agent.cjs
