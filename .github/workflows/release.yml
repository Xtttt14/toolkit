name: Release Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist
      - run: >
          gh release create "$env:GITHUB_REF_NAME"
          "release/*.exe"
          "release/*.blockmap"
          "release/latest.yml"
          --title "个人工具箱 $env:GITHUB_REF_NAME"
          --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
