name: Release Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist
      - run: |
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object FullName
          $tag = $env:GITHUB_REF_NAME
          $null = gh release view "$tag" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" --title "个人工具箱 $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag" }
          }
          gh release upload "$tag" @assets --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
